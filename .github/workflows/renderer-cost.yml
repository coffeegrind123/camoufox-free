name: renderer cost (throwaway)
on:
  push:
    branches: [tmp/renderer-cost]
permissions:
  contents: read
env:
  RELEASE: v159.0.1-beta.35-cg.17
  PR_RUN: "43862404200"
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ci/requirements.txt -e python
      - uses: ./.github/actions/fpgen-model
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libasound2t64 libdbus-glib-1-2 libx11-xcb1 \
            libxcb-shm0 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 \
            libxi6 libxrandr2 libxtst6 libpci3 zstd unzip \
            libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri
      - name: Camoufox release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -p 'camoufox-*-lin.x86_64.zip' -D .
          unzip -q camoufox-*-lin.x86_64.zip -d cf
          grep -m1 'model name' /proc/cpuinfo
      - uses: actions/download-artifact@v4
        with:
          name: camoufox-dist
          path: ${{ github.workspace }}
          run-id: ${{ env.PR_RUN }}
          github-token: ${{ github.token }}
      - run: |
          mkdir -p pr && zstd -d -c camoufox-dist.tar.zst | tar -C pr -xf -
          find pr -maxdepth 3 -name camoufox-bin
      - name: PR build
        run: python3 -u tmp/renderer_cost.py "$(realpath "$(find pr -maxdepth 3 -name camoufox-bin | head -1)")" 10
      - name: cg.17 release, same runner
        run: python3 -u tmp/renderer_cost.py "$(realpath "$(find cf -maxdepth 2 -name camoufox-bin | head -1)")" 10
