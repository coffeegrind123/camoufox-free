name: estimate lookup bench (throwaway)
on:
  push:
    branches: [tmp/neonemu-bench]
permissions:
  contents: read
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -m1 "model name" /proc/cpuinfo
          echo "GDS: $(cat /sys/devices/system/cpu/vulnerabilities/gather_data_sampling 2>/dev/null || echo n/a)"
          clang -O3 -mavx2 -mfma -mf16c -I browser/additions/gfx/skia/skia .github/prof/gather.c -o gather
          ./gather
          ./gather
