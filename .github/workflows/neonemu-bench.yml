name: emulation profile (throwaway)
on:
  push:
    branches: [tmp/neonemu-bench]
permissions:
  contents: read
  actions: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -r ci/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libasound2t64 libdbus-glib-1-2 libx11-xcb1 \
            libxcb-shm0 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 libxi6 libxrandr2 libxtst6 libpci3 zstd \
            libegl1 libegl-mesa0 libgl1-mesa-dri libgles2
      - uses: actions/download-artifact@v4
        with:
          name: camoufox-dist
          run-id: 45055585616
          github-token: ${{ github.token }}
      - run: |
          mkdir -p .ci-browser && zstd -d -c camoufox-dist.tar.zst | tar -C .ci-browser -xf -
          echo "CAMOUFOX_BINARY=$(realpath .ci-browser/bin/camoufox-bin)" >> $GITHUB_ENV
          pip install -e python
      - uses: ./.github/actions/fpgen-model
      - run: grep -m1 "model name" /proc/cpuinfo; grep -o -m1 "gather_data_sampling[^ ]*" /proc/cpuinfo || true; cat /sys/devices/system/cpu/vulnerabilities/gather_data_sampling || true
      - name: disasm
        run: |
          X=.ci-browser/lib/camoufox/libxul.so; [ -f $X ] || X=$(find .ci-browser -name libxul.so | head -1)
          nm -C --size-sort -S $X | grep -E " (ml3|armhsw)::(hue|saturation|luminosity|colordodge|multiply|store_8888)\(" > syms.txt || true
          cat syms.txt
          while read addr size t name; do
            s=$((16#$addr)); e=$((s + 16#$size))
            objdump -d --no-show-raw-insn --start-address=$s --stop-address=$e $X > fn.txt
            n=$(grep -cE "^ +[0-9a-f]+:" fn.txt); sp=$(grep -cE "\(%rsp\)" fn.txt); br=$(grep -cE "\sj[a-z]+ " fn.txt); cl=$(grep -cE "call" fn.txt)
            echo "${name%%(*} insns=$n rsp=$sp branches=$br calls=$cl"
          done < syms.txt
          for f in "armhsw::hue(" ; do
            line=$(grep -F "$f" syms.txt | head -1); set -- $line; s=$((16#$1)); e=$((s + 16#$2))
            objdump -d --no-show-raw-insn --start-address=$s --stop-address=$e $X | grep -E "call" | sed 's/.*call/call/' | sort | uniq -c | sort -rn | head
          done
