name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"
      # The font bundle ships as its own release, in a separate tag namespace so
      # it does not appear among the browser downloads. Those tags must not
      # trigger a browser build (see browser/scripts/fetch-fonts.py).
      - "!font-bundle-*"
      # PGO training profiles are releases too (ci/pgo.py publish).
      - "!pgo-*"

permissions: {}

env:
  # The version tests.yml builds and tests with, so a release is compiled by the
  # same interpreter every pull request's build job already exercised.
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Require a tested main commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m ci.release check-release --tag "$GITHUB_REF_NAME"

  ubo:
    # Resolve once per build, so the browser packages and their release notes
    # name the same uBlock Origin release even if AMO publishes mid-run.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pin: ${{ steps.resolve.outputs.pin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: resolve
        run: python3 browser/scripts/fetch-ubo.py resolve

  build:
    needs: [verify, ubo]
    if: >-
      always() &&
      needs.ubo.result == 'success' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # `make dir` (inside ci.run_prepare) writes the mozconfig and adds the Rust
      # targets from BUILD_TARGET, defaulting to macos,arm64 when it is unset.
      # multibuild.py sets the same value again before building.
      BUILD_TARGET: ${{ matrix.target }},${{ matrix.arch }}
      # scripts/package.py stages this exact release under addons/UBO/.
      CAMOUFOX_UBO: ${{ needs.ubo.outputs.pin }}
    strategy:
      matrix:
        # This fork only ships the Linux x86_64 build its Docker image runs;
        # the other five targets cost ~10 runner-hours per release for nothing.
        target: [linux]
        arch: [x86_64]

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@8831c82abf29b34eb2caac48d5f999ecfc0d8eef # v4.1
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          verbose: "false"

      - name: Remove unwanted tools
        # Originally from here: https://github.com/AdityaGarg8/remove-unwanted-software/blob/master/action.yml
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' > /dev/null
          sudo apt-get remove -y '^dotnet-.*' > /dev/null
          sudo apt-get remove -y '^llvm-.*' > /dev/null
          sudo apt-get remove -y 'php.*' > /dev/null
          sudo apt-get remove -y '^mongodb-.*' > /dev/null
          sudo apt-get remove -y '^mysql-.*' > /dev/null
          sudo apt-get remove -y azure-cli google-chrome-stable firefox ${POWERSHELL} mono-devel libgl1-mesa-dri --fix-missing > /dev/null
          if [[ (${CODENAME} = focal) || (${CODENAME} = jammy) ]]; then
            sudo apt-get remove -y google-cloud-sdk --fix-missing > /dev/null
            sudo apt-get remove -y google-cloud-cli --fix-missing > /dev/null
          fi
          sudo apt-get autoremove -y > /dev/null
          sudo apt-get clean > /dev/null

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: The tag names the browser upstream.sh builds
        # Release tags are v<version>-<release>-cg.<n> (v156.0.1-beta.32-cg.8).
        # The zip is named from upstream.sh, not the tag, so a tag that
        # disagrees would publish one browser under another's name.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          . browser/upstream.sh
          case "$GITHUB_REF_NAME" in
            "v$version-$release"|"v$version-$release"-*) ;;
            *) echo "::error::tag $GITHUB_REF_NAME does not start with v$version-$release (browser/upstream.sh)"; exit 1 ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y lld-18 clang-18
          if [ "${{ matrix.arch }}" != "x86_64" ]; then
            sudo apt-get install -y libc6-i386 lib32gcc-s1 lib32stdc++6 gcc-multilib g++-multilib
          fi
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100

      - name: Check disk space
        run: df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          # ccache: the mozconfig enables --with-ccache, but the runner image no
          # longer ships it, so configure fails with "Cannot find ccache".
          # fontconfig: browser/scripts/verify-fonts.py resolves every reportable family
          # through fc-list/fc-match, so the bundle is checked with the same tool
          # the browser uses rather than assumed correct.
          sudo apt-get install -y msitools p7zip-full aria2 ccache fontconfig

      - name: Fetch the font bundle
        # The bundle is a release asset, not repo content (~2.16 GB extracted,
        # 843 MB as .tar.xz -- see browser/scripts/fetch-fonts.py). Without this
        # the package would ship with NO fonts while
        # python/src/camoufox/fonts.json still reports hundreds of families,
        # which is a reverse leak in the shipped browser. After the dependency
        # install, so the download uses aria2c's parallel connections rather
        # than the curl fallback.
        working-directory: browser
        run: make fonts-extract

      - name: Verify the font bundle matches the manifest
        # Full run, not --quick: this is the release path, and the one invariant
        # that cannot be recovered after publishing is a family fonts.json
        # reports that the packaged fontconfig cannot resolve.
        # It checks the launcher's own font draws, so it needs the camoufox
        # package and its dependencies.
        working-directory: browser
        run: |
          python3 -m pip install -e ../python
          python3 scripts/verify-fonts.py

      - name: Pin the Rust release the optimized build links with
        # Before bootstrap, so every rustc the build runs is this one.
        run: python3 -m ci.pgo toolchain

      - name: Prepare the source tree
        # setup-minimal (which fetches the tarball) -> dir -> mozbootstrap, with
        # the two network-bound steps retried on transient failures, exactly as
        # the tests.yml build job does. multibuild.py then finds _READY and
        # builds without re-patching.
        run: python3 -m ci.run_prepare

      - name: Optimize as stock does (LTO + PGO)
        # A release without the pinned profile for this Firefox version is
        # refused: it would ship the C++-vs-JIT timing ratio ci/pgo.py
        # describes. Run the "PGO profile" workflow and pin its output.
        run: |
          python3 -m ci.pgo check
          python3 -m ci.pgo fetch --require

      - name: Create swap space
        run: |
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /

      - name: Build
        env:
          # Cap Rust parallelism to lower peak memory (avoids OOM/SIGTERM).
          # Tune to taste: higher = faster but more RAM.
          CARGO_BUILD_JOBS: "1"
        working-directory: browser
        run: python3 ./multibuild.py --target ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CamoufoxBuilds-${{ matrix.target }}-${{ matrix.arch }}
          path: browser/dist/*

  release:
    needs: [build, ubo]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Name the bundled uBlock Origin
        env:
          UBO: ${{ needs.ubo.outputs.pin }}
        run: |
          python3 -c 'import json, os; print("Bundles uBlock Origin " + json.loads(os.environ["UBO"])["version"] + ".")' \
            > "$RUNNER_TEMP/release-body.md"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/**/*
          body_path: ${{ runner.temp }}/release-body.md
          generate_release_notes: true
          # Published, not draft: draft assets need auth, and the Docker image
          # downloads the zip by its public release URL.
          draft: false
          prerelease: true
